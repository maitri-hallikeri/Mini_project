version: "3.9"

# ============================================================
# CLOUDSHIELD — Docker Compose (backend only, scaffold phase)
# ============================================================
#
# Services in this file:
#   backend   — the FastAPI security controller
#   postgres  — optional PostgreSQL (activate with --profile postgres)
#
# TODO: when the demo app is ready, add:
#   nginx     — reverse proxy (port 80/443) in front of the app replicas
#   app1      — first web-app replica
#   app2      — second web-app replica
#
# Usage:
#   Default (SQLite):    docker compose up --build
#   With PostgreSQL:     docker compose --profile postgres up --build
#     → also set DATABASE_URL=postgresql://cloudshield:secret@postgres:5432/cloudshield in .env

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cloudshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
